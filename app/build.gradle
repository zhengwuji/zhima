apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

// 本地签名参数（不入库）：仓库根目录 signing.properties 或 gradle.properties
def signingProps = new Properties()
def signingPropsFile = rootProject.file('signing.properties')
if (signingPropsFile.exists()) {
    signingPropsFile.withInputStream { signingProps.load(it) }
}

android {
    def version = project.getProperties().get("version")
    if (version == null || "unspecified".equalsIgnoreCase(version)) {
        // 默认版本号；正式发布时由 CI 通过 -Pversion=<tag> 覆盖
        version = "1.0.0"
    }
    project.ext.appVersion = version
    // 版本元信息：原先用 Groovy 的 'cmd'.execute()，在 Gradle 9 下属于已废弃的配置期进程调用
    // （与 configuration cache 不兼容），且浅克隆/无 git 环境会静默得到 versionCode=1。
    // 现改用 providers.exec（惰性、可被 configuration cache 记录），并支持 -P 显式覆盖，
    // 让 CI 与离线环境都能构建出确定性的版本信息。
    def gitCommitHash = project.hasProperty("gitCommitHash") ? project.getProperties().get("gitCommitHash") : "unknown"
    def gitBranchName = project.hasProperty("gitBranchName") ? project.getProperties().get("gitBranchName") : "unknown"
    def gitCommitCount = 1
    try {
        if (!project.hasProperty("gitCommitHash")) {
            gitCommitHash = providers.exec { commandLine 'git', 'rev-parse', '--short', 'HEAD' }
                    .standardOutput.asText.get().trim()
        }
        if (!project.hasProperty("gitBranchName")) {
            gitBranchName = providers.exec { commandLine 'git', 'rev-parse', '--abbrev-ref', 'HEAD' }
                    .standardOutput.asText.get().trim()
        }
        gitCommitCount = providers.exec { commandLine 'git', 'rev-list', '--count', 'HEAD' }
                .standardOutput.asText.get().trim().toInteger()
    } catch (Exception ignored) {
        // 非 git 环境保持默认值，不再让构建失败
    }
    def buildTime = new Date().format("yyyy-MM-dd HH:mm:ss", TimeZone.getTimeZone("Asia/Shanghai"))

    compileSdk 37
    namespace 'io.github.aw1y2z.sesame'
    defaultConfig {
        applicationId "io.github.aw1y2z.sesame"
        minSdk 26
        //noinspection ExpiredTargetSdkVersion
        targetSdk 34
        versionCode gitCommitCount
        versionName version

        buildConfigField "String", "GIT_COMMIT_HASH", "\"${gitCommitHash}\""
        buildConfigField "String", "GIT_BRANCH_NAME", "\"${gitBranchName}\""
        buildConfigField "String", "BUILD_TIME", "\"${buildTime}\""

        // 单元测试：纯 JVM 逻辑（字符串/时间/idMap 等）不依赖设备，CI 里用 ./gradlew test 跑
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    lint {
        // 模块性质（Xposed 注入 + 大量宿主反射）决定 lint 会持续报噪声，
        // 这里只作为报告产出，不阻断 release 构建：CI 以 continue-on-error 收集结果
        abortOnError false
        checkReleaseBuilds false
        warningsAsErrors false
    }

    // 自用签名：优先 -P 参数 / signing.properties / 环境变量（CI Secrets）。
    // 都取不到时不配置签名（产出未签名 APK，仅用于编译校验）。
    // 密钥库不入库（见 .gitignore）：本机放 keystore/sesame-release.jks，CI 用 Secrets 还原。
    def sesameStoreFile = project.findProperty("SESAME_STORE_FILE")
            ?: signingProps.getProperty("SESAME_STORE_FILE")
            ?: System.getenv("SESAME_STORE_FILE")
    def sesameStorePassword = project.findProperty("SESAME_STORE_PASSWORD")
            ?: signingProps.getProperty("SESAME_STORE_PASSWORD")
            ?: System.getenv("SESAME_STORE_PASSWORD")
    def sesameKeyAlias = project.findProperty("SESAME_KEY_ALIAS")
            ?: signingProps.getProperty("SESAME_KEY_ALIAS")
            ?: System.getenv("SESAME_KEY_ALIAS")
    def sesameKeyPassword = project.findProperty("SESAME_KEY_PASSWORD")
            ?: signingProps.getProperty("SESAME_KEY_PASSWORD")
            ?: System.getenv("SESAME_KEY_PASSWORD")
    if (sesameStoreFile != null && !sesameStoreFile.trim().isEmpty()) {
        signingConfigs {
            releaseSelf {
                storeFile rootProject.file(sesameStoreFile)
                storePassword sesameStorePassword
                keyAlias sesameKeyAlias
                keyPassword sesameKeyPassword
            }
        }
    }
    buildFeatures {
        buildConfig = true // 显式启用 BuildConfig
        compose = true
    }
    ext {
        applicationName = "Sesame-M"
        applicationType = "Normal"
    }
    flavorDimensions.add("default")
    productFlavors {
        normal {
            dimension "default"
            ext.applicationType = "Normal"
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (sesameStoreFile != null && !sesameStoreFile.trim().isEmpty()) {
                signingConfig signingConfigs.releaseSelf
            }
        }
    }
    // 按 ABI 拆分 APK：仅发布 arm 主流架构，保留 universal 全架构兜底包
    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a"
            universalApk true
        }
    }
    packaging {
        resources {
            merges += "META-INF/xposed/**"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

androidComponents {
    onVariants(selector().withBuildType('release')) { variant ->
        variant.outputs.forEach { output ->
            // 按 ABI 区分产物名：arm64-v8a / armeabi-v7a；无 ABI filter 的为 universal 兜底包
            String abiTag = "-universal"
            output.getFilters().forEach { f ->
                if (f.getFilterType().name() == 'ABI') {
                    abiTag = "-" + f.getIdentifier()
                }
            }
            output.outputFileName.set("Sesame-M-Normal${abiTag}-${project.appVersion}.apk")
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    compileOnly 'io.github.libxposed:api:102.0.0'
    implementation 'io.github.libxposed:service:102.0.0'
    compileOnly group: 'org.projectlombok', name: 'lombok', version: '1.18.32'
    annotationProcessor group: 'org.projectlombok', name: 'lombok', version: '1.18.32'
    implementation 'com.elvishew:xlog:1.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-core', version: '2.18.2'
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.18.2'
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-annotations', version: '2.18.2'

    // NanoHTTPD 核心依赖（最新稳定版）
    implementation 'org.nanohttpd:nanohttpd:2.3.1'

    // Kotlin + Compose（miuix UI 重构基础）
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.4.0"
    implementation "androidx.activity:activity-compose:1.9.3"
    implementation "top.yukonga.miuix.kmp:miuix-ui:0.9.3"
    implementation "top.yukonga.miuix.kmp:miuix-preference:0.9.3"
    implementation "androidx.compose.material:material-icons-extended:1.7.6"

    // 单元测试（纯 JVM，不依赖设备）：CI 里 `./gradlew test` 作为门禁
    testImplementation 'junit:junit:4.13.2'
}

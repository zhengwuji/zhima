# Sesame-M 专属 CI：每次代码改动自动编译 APK，并发布到 Releases
#
# 触发：
#   · push 到 main / master → 跑单测 + 构建签名 APK + 自动发布 Release
#   · push 到 MIUIX* 等其它分支 → 只构建并上传 Artifact（不发版）
#   · 手动 workflow_dispatch → 可指定版本号 / 是否发版
#
# 版本号：自动取最近一个 v* tag 并把 patch +1（首个版本为 v1.0.0）。
#         可用 dispatch 的 version 输入强制指定（如 v2.0.0）。
#   ⚠️ 本工作流不再监听 tag 事件，避免"CI 自己创建的 tag"再次触发构建形成回环。
#
# 签名（Repository secrets，缺一不可；未配置时只构建不发版）：
#   SESAME_KEYSTORE_BASE64  keystore 文件的 base64
#   SESAME_STORE_PASSWORD   密钥库口令
#   SESAME_KEY_ALIAS        密钥别名
#   SESAME_KEY_PASSWORD     密钥口令
#   生成方式：python tools/gen_keystore.py --print-secrets

name: Build APK

on:
  push:
    branches: [main, master, 'MIUIX*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 v1.2.0）；留空则自动 +1'
        required: false
        default: ''
      release:
        description: '是否发布到 Releases'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: 单测与静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew test --no-daemon --stacktrace
      - name: Lint (report only)
        continue-on-error: true
        run: ./gradlew lintNormalRelease --no-daemon
      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/**
          if-no-files-found: ignore

  build:
    name: 构建并签名 APK
    needs: checks
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.name }}
      do_release: ${{ steps.version.outputs.do_release }}
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          INPUT="${{ github.event.inputs.version }}"
          LAST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [ -n "$INPUT" ]; then
            NAME="${INPUT#v}"
          elif [ -n "$LAST_TAG" ]; then
            BASE="${LAST_TAG#v}"
            MAJOR=$(echo "$BASE" | cut -d. -f1)
            MINOR=$(echo "$BASE" | cut -d. -f2)
            PATCH=$(echo "$BASE" | cut -d. -f3)
            [ -z "$PATCH" ] && PATCH=0
            NAME="${MAJOR}.${MINOR}.$((PATCH + 1))"
          else
            NAME="1.0.0"
          fi

          # 是否发版：主分支 push 或手动指定 release=true
          DO_RELEASE=false
          if [ "${GITHUB_REF}" = "refs/heads/main" ] || [ "${GITHUB_REF}" = "refs/heads/master" ]; then
            DO_RELEASE=true
          fi
          if [ -n "${{ github.event.inputs.release }}" ]; then
            DO_RELEASE="${{ github.event.inputs.release }}"
          fi

          {
            echo "name=$NAME"
            echo "do_release=$DO_RELEASE"
          } >> "$GITHUB_OUTPUT"
          echo "版本=$NAME  上一条 tag=${LAST_TAG:-<none>}  发版=$DO_RELEASE"

      - name: Restore signing keystore
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.SESAME_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning::未配置 SESAME_KEYSTORE_BASE64，本次只产出未签名 APK，跳过发版"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sesame-release.jks"
          {
            echo "SESAME_STORE_FILE=$RUNNER_TEMP/sesame-release.jks"
            echo "SESAME_STORE_PASSWORD=${{ secrets.SESAME_STORE_PASSWORD }}"
            echo "SESAME_KEY_ALIAS=${{ secrets.SESAME_KEY_ALIAS }}"
            echo "SESAME_KEY_PASSWORD=${{ secrets.SESAME_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build release APKs
        run: |
          ./gradlew assembleNormalRelease --no-daemon \
            -Pversion=${{ steps.version.outputs.name }} \
            -PgitCommitHash=$(git rev-parse --short HEAD) \
            -PgitBranchName=${GITHUB_REF_NAME}

      - name: Stage artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/normal/release/*.apk dist/ 2>/dev/null || true
          if [ -z "$(ls -A dist)" ]; then
            echo "没有找到 APK 产物"; exit 1
          fi
          MAPPING=$(ls app/build/outputs/mapping/normalRelease/mapping.txt 2>/dev/null || true)
          if [ -n "$MAPPING" ]; then
            cp "$MAPPING" "dist/mapping-${{ steps.version.outputs.name }}.txt"
          fi
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && ls -l)

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sesame-m-${{ steps.version.outputs.name }}-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error

  release:
    name: 发布到 Releases
    needs: build
    if: needs.build.outputs.do_release == 'true' && needs.build.outputs.signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: sesame-m-${{ needs.build.outputs.version_name }}-${{ github.run_number }}
          path: dist

      - name: Ensure tag does not already exist
        run: |
          set -euo pipefail
          TAG="v${{ needs.build.outputs.version_name }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::tag $TAG 已存在，请用手动触发并指定更大的版本号"
            exit 1
          fi
          echo "tag $TAG 可用"

      - name: Compose release notes
        id: notes
        run: |
          set -euo pipefail
          VERSION="${{ needs.build.outputs.version_name }}"
          PREV_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n 1 || true)
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE=$(git rev-list --max-parents=0 HEAD)
          fi
          {
            echo "## Sesame-M v${VERSION}"
            echo ""
            echo "> 更新内容（自动摘取自上一条 Release 之后提交）："
            echo ""
            git log --no-merges --pretty=format:'- %s (%h)' $RANGE 2>/dev/null || echo "- 首次构建"
            echo ""
            echo ""
            echo "### 下载说明"
            echo "- \`Sesame-M-Normal-arm64-v8a-*.apk\`：64 位设备（绝大多数现代手机）"
            echo "- \`Sesame-M-Normal-armeabi-v7a-*.apk\`：32 位旧设备"
            echo "- \`Sesame-M-Normal-universal-*.apk\`：全架构兜底包"
            echo "- \`SHA256SUMS.txt\`：各 APK 的 SHA-256，下载后建议核对"
            echo "- \`mapping-*.txt\`：R8 混淆映射，用于崩溃栈还原"
            echo ""
            echo "要求 Android 8.0（API 26）及以上；自签名包，与其它同源模块可共存安装。"
          } > release-notes.md
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          cat release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: Sesame-M v${{ needs.build.outputs.version_name }}
          body_path: release-notes.md
          files: dist/*
          draft: false
          generate_release_notes: false
